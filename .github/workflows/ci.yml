name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verify_test
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: local-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify -d verify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://verify:local-ci-only-password@localhost:5432/verify_test
      SECURITY_PEPPER: only-for-ci-not-for-real-deployments-very-long-random-required
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run test
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://example.invalid
